name: Build and Deploy Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: frontend-production
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  CONTAINER_NAME: apriansyah-portfolio
  HOST_PORT: 3002
  CONTAINER_PORT: 80

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host key
        shell: bash
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}

      - name: Log in and deploy on VPS
        shell: bash
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          HOST_PORT: ${{ env.HOST_PORT }}
          CONTAINER_PORT: ${{ env.CONTAINER_PORT }}
        run: |
          set -euo pipefail

          printf '%s' "$GHCR_TOKEN" | ssh "$VPS_USER@$VPS_HOST" \
            "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"

          ssh "$VPS_USER@$VPS_HOST" \
            "IMAGE='$IMAGE' CONTAINER_NAME='$CONTAINER_NAME' HOST_PORT='$HOST_PORT' CONTAINER_PORT='$CONTAINER_PORT' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          if ! command -v docker >/dev/null 2>&1; then
            echo 'Docker tidak ditemukan di VPS.' >&2
            exit 1
          fi

          existing_container="$(docker ps --filter "name=^/${CONTAINER_NAME}$" --format '{{.Names}}')"
          if ss -ltnH | awk '{print $4}' | grep -Eq ":${HOST_PORT}$" && [ "$existing_container" != "$CONTAINER_NAME" ]; then
            echo "Port ${HOST_PORT} sedang digunakan di VPS. Pilih port lain atau bebaskan port tersebut." >&2
            exit 1
          fi

          docker pull "$IMAGE"
          docker rm -f "$CONTAINER_NAME" 2>/dev/null || true
          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            --label com.example.deploy.sha="$IMAGE" \
            -p "$HOST_PORT:$CONTAINER_PORT" \
            "$IMAGE"

          docker image prune -af --filter 'until=168h'
          docker ps --filter "name=^/${CONTAINER_NAME}$" --format 'Container {{.Names}} is running on host port {{.Ports}}'
          REMOTE_SCRIPT
